<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF & Excel Report Client</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    button { margin-right: 10px; padding: 10px 14px; cursor: pointer; }
    iframe { width: 100%; height: 90vh; border: 1px solid #ccc; margin-top: 16px; }
    pre { background: #f6f6f6; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h2>Generate PDF report</h2>
  <button id="btnGeneratePDF">Generate PDF</button>
  <button id="btnDownloadPDF" disabled>Download PDF</button>

  <h2>Download Excel report</h2>
  <button id="btnDownloadXLSX">Download XLSX</button>

  <p id="status">Idle</p>
  <iframe id="pdfFrame"></iframe>

  <h3>Last response</h3>
  <pre id="log"></pre>

  <script>
    const pdfEndpoint = 'http://localhost:4004/odata/v4/user-reports/generateUserStatsPDF';
    const excelEndpoint = 'http://localhost:4004/odata/v4/user-reports/generateUserStatsXLSX';

    const payload = {
      stats: {
        totalUsers: 1250,
        activeUsers: 980,
        totalOrders: 4567,
        avgOrderValue: 245.67,
        totalLifetimeValue: 1256789.45,
        avgOrdersPerUser: 3.65,
        avgLifetimeValue: 1005.43,
        newUsers2024: 320,
        topCustomers: [
          { userId: 123, lifetimeValue: 12567.89 },
          { userId: 456, lifetimeValue: 9876.54 },
          { userId: 789, lifetimeValue: 7654.32 },
          { userId: 101, lifetimeValue: 6543.21 },
          { userId: 222, lifetimeValue: 5432.10 }
        ]
      }
    };

    let currentPdfBlobUrl = null;

    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const frameEl = document.getElementById('pdfFrame');
    const downloadPdfBtn = document.getElementById('btnDownloadPDF');
    const downloadXlsxBtn = document.getElementById('btnDownloadXLSX');

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setLog(obj) {
      logEl.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
    }

    function setPdf(blob) {
      if (currentPdfBlobUrl) URL.revokeObjectURL(currentPdfBlobUrl);
      currentPdfBlobUrl = URL.createObjectURL(blob);
      frameEl.src = currentPdfBlobUrl;
      downloadPdfBtn.disabled = false;
    }

    async function generatePdf() {
      setStatus('Sending PDF request...');
      setLog(payload);

      const res = await fetch(pdfEndpoint, {
        method: 'POST',
        headers: {
          'Authorization': 'Basic YWRtaW46YWRtaW4xMjM0NQ==',
          'Content-Type': 'application/json',
          'Accept': 'application/pdf'
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(`HTTP ${res.status}: ${text}`);
      }

      const blob = await res.blob();
      setPdf(blob);
      setStatus('PDF generated and shown.');
    }

    async function downloadExcel() {
      setStatus('Sending XLSX request...');
      setLog(payload);

      const res = await fetch(excelEndpoint, {
        method: 'POST',
        headers: {
          'Authorization': 'Basic YWRtaW46YWRtaW4xMjM0NQ==',
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(`HTTP ${res.status}: ${text}`);
      }

      const arrayBuffer = await res.arrayBuffer();
      const blob = new Blob([arrayBuffer], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'user-stats.xlsx';
      a.click();
      URL.revokeObjectURL(url);

      setStatus('XLSX downloaded.');
    }

    document.getElementById('btnGeneratePDF').addEventListener('click', async () => {
      try {
        downloadPdfBtn.disabled = true;
        await generatePdf();
      } catch (e) {
        setStatus('Error');
        setLog(String(e));
      }
    });

    downloadPdfBtn.addEventListener('click', () => {
      if (!currentPdfBlobUrl) return;
      const a = document.createElement('a');
      a.href = currentPdfBlobUrl;
      a.download = 'user-stats.pdf';
      a.click();
    });

    downloadXlsxBtn.addEventListener('click', async () => {
      try {
        await downloadExcel();
      } catch (e) {
        setStatus('Error');
        setLog(String(e));
      }
    });
  </script>
</body>
</html>
